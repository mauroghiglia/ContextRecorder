[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextrecorder"
version = "0.1.0"
description = "Audio recorder for ContextSuggest"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "sounddevice",
    "soundfile",
    "numpy",
]

[project.scripts]
contextrecorder = "contextrecorder.cli:main"

[tool.setuptools]
packages = ["contextrecorder"]